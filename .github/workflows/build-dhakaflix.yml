name: Build DhakaFlix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :src:all:dhakaflix:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dhakaflix-apk
          path: src/all/dhakaflix/build/outputs/apk/debug/*.apk
